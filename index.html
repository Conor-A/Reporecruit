<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepoRecruit — Web3 Talent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── Morpho Palette ── */
  --bg:#15181A;          /* Neutral 900 */
  --surface:#222529;     /* Neutral 700 */
  --surface2:#1c1f22;    /* Neutral 800 (between 900/700) */
  --surface3:#383B3E;    /* Neutral 500 */
  --b1:#2d3033;          /* subtle border */
  --b2:#383B3E;          /* Neutral 500 border */

  /* Blue scale */
  --a:#2973FF;           /* Blue Dark – primary action */
  --a-light:rgba(41,115,255,0.12);
  --a-mid:#5792FF;       /* Blue Medium */
  --teal:#5792FF;        /* Blue Medium (secondary active) */
  --teal-light:rgba(87,146,255,0.1);
  --amber:#C4DAFF;       /* Blue Light (highlights/notes) */
  --amber-light:rgba(196,218,255,0.1);

  /* Text */
  --navy:#FFFFFF;        /* Heading / display text */
  --navy2:#C4DAFF;       /* Blue Light – decorative secondary */
  --warn:#FF5555;
  --t:#FFFFFF;           /* Primary text */
  --t2:#9C9D9F;          /* Neutral 100 – secondary text */
  --t3:#6F7174;          /* Neutral 300 – muted */
  --t4:#6F7174;          /* Placeholders / very muted */

  /* FK Grotesk → Inter (closest available) */
  --font-ui:'Inter',system-ui,sans-serif;
  --font-display:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;

  /* Theme-aware overrides */
  --header-bg:rgba(21,24,26,0.95);
  --overlay-bg:rgba(0,0,0,0.75);
  --drawer-shadow:0 -8px 60px rgba(0,0,0,0.6);
  --sticky-shadow:-3px 0 8px rgba(0,0,0,0.3);
  --row-hover:rgba(41,115,255,0.05);
}

html,body{height:100%;background:var(--bg);color:var(--t);font-family:var(--font-ui);overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
header{border-bottom:1px solid var(--b1);padding:0;position:sticky;top:0;background:var(--header-bg);backdrop-filter:blur(16px);z-index:100;box-shadow:0 1px 0 var(--b1)}
.hinner{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 24px;max-width:1280px;margin:0 auto}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:0 24px}
.logo{display:flex;align-items:center;gap:10px}
.hex{width:26px;height:26px;background:var(--a);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)}
.logo-text{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--navy);letter-spacing:-0.5px}.logo-text span{color:var(--a)}
.logo-sub{font-size:9px;color:var(--t3);letter-spacing:2.5px;text-transform:uppercase;font-family:var(--font-mono)}
.hright{display:flex;align-items:center;gap:8px}
.saved-btn{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--b2);border-radius:6px;color:var(--t2);cursor:pointer;font-family:var(--font-ui);font-size:12px;font-weight:500;padding:6px 12px;transition:all .15s}
.saved-btn:hover{border-color:var(--a);color:var(--a)}
.sc{background:var(--a);color:#fff;border-radius:10px;font-size:9px;font-weight:700;padding:1px 6px;margin-left:2px}
.pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t3);background:var(--surface);border:1px solid var(--b1);padding:5px 11px;border-radius:20px;font-family:var(--font-ui)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--a);animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── HERO ── */
.hero{padding:52px 0 36px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--a);margin-bottom:20px;border:1px solid rgba(41,115,255,0.3);padding:5px 14px;border-radius:20px;background:var(--a-light);font-family:var(--font-mono)}
.htitle{font-family:var(--font-display);font-size:clamp(28px,4.5vw,52px);font-weight:800;line-height:1.06;margin-bottom:14px;color:var(--navy);letter-spacing:-1px}
.htitle em{font-style:normal;font-weight:800;color:var(--a)}
.htitle .dim{color:var(--t3)}
.hsub{font-size:14px;color:var(--t2);line-height:1.8;max-width:480px;margin:0 auto 32px;font-weight:400}

/* ── MODE TOGGLE ── */
.mode-toggle{display:flex;background:var(--surface);border:1px solid var(--b1);border-radius:8px;padding:4px;max-width:400px;margin:0 auto 28px}
.mbtn{flex:1;background:transparent;border:none;border-radius:5px;color:var(--t3);cursor:pointer;font-family:var(--font-ui);font-size:12px;font-weight:500;letter-spacing:0.2px;padding:8px 14px;transition:all .15s}
.mbtn.on{background:var(--a);color:#fff;box-shadow:0 1px 8px rgba(41,115,255,0.35)}

/* ── SEARCH CARD ── */
.card{background:var(--surface);border:1px solid var(--b1);border-radius:12px;padding:24px;max-width:760px;margin:0 auto 32px;position:relative;border-top:2px solid var(--a)}
.flabel{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-bottom:8px;font-weight:600;font-family:var(--font-mono)}
.irow{display:flex;gap:8px}
input[type=text],input[type=password],input[type=url],textarea{background:var(--bg);border:1px solid var(--b2);border-radius:6px;color:var(--t);font-family:var(--font-ui);font-size:13px;padding:10px 14px;outline:none;transition:all .15s;width:100%}
input:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(41,115,255,0.15);background:var(--surface2)}
input::placeholder,textarea::placeholder{color:var(--t4)}
.sbtn{background:var(--a);border:none;border-radius:6px;color:#fff;cursor:pointer;font-family:var(--font-ui);font-size:12px;font-weight:600;letter-spacing:0.3px;padding:10px 20px;transition:all .15s;white-space:nowrap}
.sbtn:hover:not(:disabled){background:#1a5fd4;box-shadow:0 2px 12px rgba(41,115,255,0.4);transform:translateY(-1px)}
.sbtn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.abtn{background:var(--a);border:none;border-radius:6px;color:#fff;cursor:pointer;font-family:var(--font-ui);font-size:12px;font-weight:600;letter-spacing:0.3px;padding:10px 20px;transition:all .15s;white-space:nowrap}
.abtn:hover{background:#1a5fd4;transform:translateY(-1px)}
.hint{margin-top:8px;font-size:11px;color:var(--t3)}.hint span{color:var(--t2);font-weight:500}
.trow{margin-top:14px;padding-top:14px;border-top:1px solid var(--b1)}
.tnote{margin-top:6px;font-size:11px;color:var(--t3);line-height:1.7}
.tnote a{color:var(--a)}

/* ── AI SUGGESTIONS ── */
.ai-sugg{margin-top:20px}
.ai-sugg-title{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-bottom:10px;font-weight:600;font-family:var(--font-mono)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.scard{background:var(--surface2);border:1px solid var(--b1);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all .15s}
.scard:hover{border-color:var(--a);transform:translateY(-1px);box-shadow:0 4px 16px rgba(41,115,255,0.15)}
.srepo{font-size:11px;color:var(--a);margin-bottom:4px;font-weight:500}
.sreason{font-size:10px;color:var(--t3);line-height:1.5}
.stags{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.preset{background:var(--surface2);border:1px solid var(--b2);border-radius:20px;color:var(--t2);cursor:pointer;font-family:var(--font-ui);font-size:11px;font-weight:500;padding:4px 12px;transition:all .15s}
.preset:hover{border-color:var(--a);color:var(--a)}

/* ── ERROR / LOADER ── */
.erbox{background:rgba(255,85,85,0.07);border:1px solid rgba(255,85,85,0.25);border-radius:8px;padding:14px 18px;font-size:12px;color:var(--warn);margin-bottom:18px;max-width:760px;margin-left:auto;margin-right:auto}
.loader{text-align:center;padding:64px 0}
.lbar{width:200px;height:2px;background:var(--b2);border-radius:2px;margin:0 auto 18px;overflow:hidden;position:relative}
.lfill{position:absolute;top:0;left:0;width:60px;height:100%;background:linear-gradient(90deg,var(--a),var(--navy2));animation:lslide 1.2s ease-in-out infinite}
@keyframes lslide{0%{transform:translateX(-60px)}100%{transform:translateX(200px)}}
.ltext{font-size:13px;color:var(--t2);font-weight:500}.lsub{font-size:11px;color:var(--t3);margin-top:5px}

/* ── REPO BANNER ── */
.rbanner{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--b1);border-radius:10px;padding:14px 18px;margin-bottom:16px}
.rtitle{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--navy)}
.rdesc{font-size:11px;color:var(--t3);max-width:360px;margin-top:2px}
.rstat{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--t2)}

/* ── STATS BAR ── */
.sbar{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--b1);border-radius:10px;padding:14px 16px;border-left:2px solid var(--a)}
.snum{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;margin-bottom:4px;color:var(--navy)}
.slabel{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--t3);font-weight:600;font-family:var(--font-mono)}

/* ── RESULTS HEADER ── */
.rheader{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.rmeta{display:flex;align-items:center;gap:10px}
.rtitle2{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--navy)}
.cpill{background:var(--teal-light);border:1px solid rgba(87,146,255,0.25);border-radius:20px;font-size:11px;color:var(--teal);padding:3px 11px;font-weight:500}
.bgroup{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.obtn{background:var(--surface);border:1px solid var(--b2);border-radius:6px;color:var(--t2);cursor:pointer;font-family:var(--font-ui);font-size:11px;font-weight:500;padding:7px 13px;transition:all .15s}
.obtn:hover{border-color:var(--a);color:var(--a)}
.sfilter{background:var(--surface);border:1px solid var(--b2);border-radius:6px;color:var(--t);font-family:var(--font-ui);font-size:12px;padding:7px 12px;outline:none;width:200px}
.sfilter:focus{border-color:var(--a);box-shadow:0 0 0 2px rgba(41,115,255,0.15)}
.sfilter::placeholder{color:var(--t4)}

/* ── FILTER BAR ── */
.fbar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.fbtn{background:var(--surface);border:1px solid var(--b2);border-radius:20px;color:var(--t3);cursor:pointer;font-family:var(--font-ui);font-size:11px;font-weight:500;padding:4px 13px;transition:all .15s}
.fbtn.on{border-color:var(--a);color:var(--a);background:var(--a-light)}
.fsep{width:1px;height:18px;background:var(--b2);margin:0 2px}
.lfbtn{background:var(--surface);border:1px solid var(--b2);border-radius:4px;color:var(--t3);cursor:pointer;font-family:var(--font-mono);font-size:9px;letter-spacing:.5px;padding:4px 10px;text-transform:uppercase;transition:all .15s;font-weight:500}
.lfbtn.on{border-color:var(--a);color:var(--a);background:var(--a-light)}

/* ── TABLE ── */
.twrap{overflow-x:auto;border:1px solid var(--b1);border-radius:10px;margin-bottom:48px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{background:var(--surface2);border-bottom:1px solid var(--b2)}
th{text-align:left;padding:10px 13px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--t3);white-space:nowrap;font-weight:600;font-family:var(--font-mono)}
tbody tr{border-bottom:1px solid var(--b1);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--row-hover)}
td{padding:11px 13px;vertical-align:middle;color:var(--t)}
.avcell{display:flex;align-items:center;gap:10px;min-width:150px}
.av{width:32px;height:32px;border-radius:50%;border:2px solid var(--b2);object-fit:cover;flex-shrink:0;cursor:pointer;transition:transform .15s}
.av:hover{transform:scale(1.1);border-color:var(--a)}
.ntext{font-weight:600;cursor:pointer;color:var(--navy);font-size:13px}.ntext:hover{color:var(--a)}
.stext{font-size:10px;color:var(--t3);margin-top:2px;font-family:var(--font-mono)}
.hlink{color:var(--a);text-decoration:none;font-weight:500}.hlink:hover{opacity:.7}
.elink{color:var(--teal);text-decoration:none;font-size:11px}.elink:hover{opacity:.7}
.noval{color:var(--t3);font-size:11px}
.bdgcell{display:flex;flex-wrap:wrap;gap:4px;min-width:90px}
/* Badges – dark-mode palette */
.bdg{border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.5px;padding:3px 7px;text-transform:uppercase;white-space:nowrap;font-family:var(--font-mono)}
.bdg-eth{background:rgba(41,115,255,0.15);border:1px solid rgba(41,115,255,0.3);color:#5792FF}
.bdg-sol{background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.3);color:#a78bfa}
.bdg-rust{background:rgba(220,80,60,0.15);border:1px solid rgba(220,80,60,0.3);color:#f87171}
.bdg-cos{background:rgba(41,115,255,0.12);border:1px solid rgba(41,115,255,0.25);color:#60a5fa}
.bdg-btc{background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.25);color:#fbbf24}
.bdg-near{background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.25);color:#34d399}
.bdg-dot{background:rgba(244,114,182,0.12);border:1px solid rgba(244,114,182,0.25);color:#f472b6}
.bdg-avax{background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.25);color:#f87171}
.bdg-lang{background:rgba(87,146,255,0.12);border:1px solid rgba(87,146,255,0.25);color:#5792FF}
.bdg-defi{background:rgba(41,115,255,0.12);border:1px solid rgba(41,115,255,0.25);color:#2973FF}
.score-wrap{min-width:75px}
.score-row{display:flex;align-items:center;gap:7px}
.score-n{font-family:var(--font-display);font-size:20px;font-weight:700;min-width:26px;color:var(--navy)}
.score-bar{flex:1;height:2px;background:var(--b2);border-radius:2px;overflow:hidden;min-width:36px}
.score-fill{height:100%;border-radius:2px}
.score-lbl{font-size:9px;color:var(--t3);margin-top:2px;letter-spacing:1px;text-transform:uppercase;font-family:var(--font-mono)}
.adot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.ahot{background:var(--a)}
.awarm{background:var(--teal)}
.acold{background:var(--t3)}
.atext{font-size:10px;vertical-align:middle;color:var(--t2)}
.libtn{display:inline-flex;align-items:center;gap:4px;background:var(--a-light);border:1px solid rgba(41,115,255,0.25);border-radius:4px;color:var(--a);font-family:var(--font-ui);font-size:10px;font-weight:500;padding:4px 9px;text-decoration:none;transition:all .15s}
.libtn:hover{background:rgba(41,115,255,0.2)}
.svbtn{background:transparent;border:1px solid var(--b2);border-radius:4px;color:var(--t3);cursor:pointer;font-size:13px;padding:4px 8px;transition:all .15s;line-height:1}
.svbtn:hover{border-color:var(--a);color:var(--a)}
.svbtn.on{border-color:var(--a);color:var(--a);background:var(--a-light)}

/* ── OVERLAY / DRAWER ── */
.overlay{position:fixed;inset:0;background:var(--overlay-bg);z-index:300;backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fdin .2s ease}
@keyframes fdin{from{opacity:0}to{opacity:1}}
.drawer{background:var(--surface);border:1px solid var(--b2);border-top:1px solid var(--b2);border-radius:16px 16px 0 0;width:100%;max-width:860px;max-height:90vh;overflow-y:auto;padding:28px;animation:sdup .25s ease;box-shadow:var(--drawer-shadow)}
@keyframes sdup{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.dtitle{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--navy)}
.cbtn{background:var(--surface2);border:1px solid var(--b2);border-radius:6px;color:var(--t2);cursor:pointer;font-size:16px;padding:4px 10px;transition:all .15s;line-height:1.2}
.cbtn:hover{border-color:var(--warn);color:var(--warn)}
.ptop{display:flex;align-items:flex-start;gap:18px;margin-bottom:22px}
.pav{width:68px;height:68px;border-radius:50%;border:2px solid var(--b2)}
.pname{font-family:var(--font-display);font-size:24px;font-weight:700;margin-bottom:3px;color:var(--navy)}
.phandle{color:var(--a);font-size:13px;margin-bottom:7px;font-weight:500}
.pbio{font-size:13px;color:var(--t2);line-height:1.65;max-width:440px}
.pmeta{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px}
.pmi{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:4px}
.psec{margin-bottom:22px}
.psect{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-bottom:11px;border-bottom:1px solid var(--b1);padding-bottom:8px;font-weight:600;font-family:var(--font-mono)}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.rcard{background:var(--surface2);border:1px solid var(--b1);border-radius:8px;padding:11px;transition:all .15s;text-decoration:none;display:block}
.rcard:hover{border-color:var(--a);box-shadow:0 4px 16px rgba(41,115,255,0.15)}
.rcard-name{color:var(--a);font-size:11px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.rcard-desc{font-size:10px;color:var(--t3);line-height:1.5;height:28px;overflow:hidden}
.rcard-meta{display:flex;gap:9px;margin-top:7px;font-size:10px;color:var(--t3)}
.narea{width:100%;background:var(--bg);border:1px solid var(--b2);border-radius:6px;color:var(--t);font-family:var(--font-ui);font-size:13px;padding:12px;outline:none;resize:vertical;min-height:80px}
.narea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(41,115,255,0.15)}
.narea::placeholder{color:var(--t4)}
.nsave{margin-top:8px;background:var(--a);border:none;border-radius:6px;color:#fff;cursor:pointer;font-family:var(--font-ui);font-size:11px;font-weight:600;padding:8px 17px;transition:all .15s}
.nsave:hover{background:#1a5fd4}

/* ── OUTREACH ── */
.tone-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tbtn{background:var(--surface2);border:1px solid var(--b2);border-radius:6px;color:var(--t2);cursor:pointer;font-family:var(--font-ui);font-size:11px;font-weight:500;padding:6px 14px;transition:all .15s}
.tbtn.on{background:var(--a);border-color:var(--a);color:#fff}
.genbtn{background:var(--a);border:none;border-radius:6px;color:#fff;cursor:pointer;font-family:var(--font-ui);font-size:11px;font-weight:600;padding:6px 16px;transition:all .15s}
.genbtn:hover{background:#1a5fd4}
.omsg-wrap{position:relative}
.omsg{width:100%;background:var(--bg);border:1px solid var(--b2);border-radius:8px;color:var(--t);font-family:var(--font-ui);font-size:13px;line-height:1.75;padding:14px;outline:none;resize:vertical;min-height:200px}
.copybtn{position:absolute;top:9px;right:9px;background:var(--surface);border:1px solid var(--b2);border-radius:5px;color:var(--t2);cursor:pointer;font-family:var(--font-ui);font-size:10px;font-weight:600;padding:5px 11px;transition:all .15s}
.copybtn.done{background:var(--teal);color:#fff;border-color:var(--teal)}
.onote{font-size:11px;color:var(--t3);margin-top:7px;line-height:1.6}

/* ── SAVED PANEL ── */
.spanel{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.svc{background:var(--surface);border:1px solid var(--b1);border-radius:10px;padding:14px;display:flex;gap:11px;align-items:flex-start}
.svc-info{flex:1}
.svc-name{font-weight:600;font-size:13px;margin-bottom:3px;color:var(--navy)}
.svc-handle{color:var(--a);font-size:11px;margin-bottom:5px;font-weight:500}
.svc-note{font-size:11px;color:var(--t3);line-height:1.5}
.unsave{background:transparent;border:none;color:var(--t3);cursor:pointer;font-size:15px;padding:0;transition:color .15s}
.unsave:hover{color:var(--warn)}
.empty{text-align:center;padding:48px 0;color:var(--t3);font-size:13px;line-height:2}

footer{border-top:1px solid var(--b1);padding:20px 0;text-align:center;font-size:11px;color:var(--t3);line-height:2;background:var(--surface2)}

/* ── BUG REPORT ── */
.bug-btn{display:flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--b2);border-radius:6px;color:var(--t3);cursor:pointer;font-family:var(--font-ui);font-size:11px;font-weight:500;padding:5px 10px;transition:all .15s}
.bug-btn:hover{border-color:var(--warn);color:var(--warn)}
.bug-modal{background:var(--surface);border:1px solid var(--b2);border-radius:14px;width:100%;max-width:520px;padding:28px;margin:auto;animation:sdup .25s ease;box-shadow:0 8px 60px rgba(0,0,0,0.6)}
.bug-field{margin-bottom:16px}
.bug-select{width:100%;background:var(--bg);border:1px solid var(--b2);border-radius:6px;color:var(--t);font-family:var(--font-ui);font-size:13px;padding:10px 14px;outline:none;appearance:none;cursor:pointer;transition:all .15s}
.bug-select:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(41,115,255,0.15)}
.bug-success{text-align:center;padding:24px 0}
.bug-success-icon{font-size:40px;margin-bottom:12px}
.bug-success-title{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--navy);margin-bottom:8px}
.bug-success-sub{font-size:13px;color:var(--t2);line-height:1.6}
.bug-meta{background:var(--surface2);border:1px solid var(--b1);border-radius:6px;padding:10px 12px;font-size:10px;color:var(--t3);font-family:var(--font-mono);line-height:1.8;margin-bottom:16px}

/* ── BREADCRUMB ── */
.breadcrumb{display:flex;align-items:center;gap:6px;padding:8px 0 16px;font-family:var(--font-ui);font-size:12px;color:var(--t3)}
.breadcrumb .bsep{color:var(--b2)}
.breadcrumb .bcurrent{color:var(--navy);font-weight:600}
.breadcrumb .blink{color:var(--a);cursor:pointer;text-decoration:none;background:none;border:none;padding:0;font-family:inherit;font-size:inherit;font-weight:500}
.breadcrumb .blink:hover{text-decoration:underline}
.back-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--b1)}
.back-btn{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--b2);border-radius:6px;color:var(--t2);cursor:pointer;font-family:var(--font-ui);font-size:11px;font-weight:500;padding:6px 12px;transition:all .15s}
.back-btn:hover{border-color:var(--a);color:var(--a)}
.back-btn-arrow{font-size:13px}
#results-anchor{scroll-margin-top:80px}

/* ── COMPANIES ── */
.co-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.co-card{background:var(--surface);border:1px solid var(--b1);border-radius:8px;padding:12px;cursor:pointer;transition:all .15s;border-left:2px solid transparent}
.co-card:hover{border-left-color:var(--a);box-shadow:0 4px 16px rgba(41,115,255,0.1);transform:translateY(-1px)}

/* ── STICKY ACTIONS COLUMN ── */
.sticky-col{position:sticky;right:0;background:var(--surface);box-shadow:var(--sticky-shadow)}
thead .sticky-col{background:var(--surface2)}
tbody tr:hover .sticky-col{background:var(--row-hover)}
.action-cell{display:flex;align-items:center;gap:4px;padding:2px 0}
.act-btn{align-items:center;background:var(--surface2);border:1px solid var(--b2);border-radius:5px;color:var(--t3);cursor:pointer;display:inline-flex;font-family:var(--font-ui);font-size:11px;font-weight:500;gap:3px;padding:4px 8px;transition:all .15s;white-space:nowrap;line-height:1.2}
.act-btn:hover{border-color:var(--a);color:var(--a);background:var(--a-light)}
.act-btn.li-btn:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-light)}
.act-btn.note-btn.has-note{border-color:var(--amber);color:var(--navy2);background:var(--amber-light)}
.act-btn.note-btn.open{border-color:var(--amber);color:var(--navy2);background:var(--amber-light)}
.act-btn.save-btn.on{border-color:var(--a);color:var(--a);background:var(--a-light)}
/* Inline note expand row */
.note-row{background:rgba(196,218,255,0.04)!important}
.note-row td{padding:6px 13px 12px!important;border-bottom:1px solid rgba(196,218,255,0.12)!important}
.note-row .sticky-col{background:rgba(196,218,255,0.04)!important}
.note-inp{width:100%;background:var(--bg);border:1px solid var(--b2);border-radius:5px;color:var(--t);font-family:var(--font-ui);font-size:12px;padding:7px 10px;outline:none;resize:none;height:52px;transition:border-color .15s}
.note-inp:focus{border-color:var(--a);box-shadow:0 0 0 2px rgba(41,115,255,0.15)}
.note-actions{display:flex;gap:6px;margin-top:6px;align-items:center}
.note-save{background:var(--a);border:none;border-radius:4px;color:#fff;cursor:pointer;font-family:var(--font-ui);font-size:11px;font-weight:600;padding:5px 13px;transition:all .15s}
.note-save:hover{background:#1a5fd4}
.note-cancel{background:transparent;border:1px solid var(--b2);border-radius:4px;color:var(--t3);cursor:pointer;font-family:var(--font-ui);font-size:11px;padding:5px 11px;transition:all .15s}
.note-cancel:hover{border-color:var(--t2);color:var(--t2)}
.note-preview{font-size:10px;color:var(--navy2);margin-left:6px;font-style:italic;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

// ── Badge Detection ──
function detectBadges(repos) {
  if (!repos || !repos.length) return [];
  const text = repos.map(r => [r.name||"",r.description||"",r.language||"",...(r.topics||[])].join(" ")).join(" ").toLowerCase();
  const badges = [];
  const seen = new Set();
  PROTOS.forEach(p => { if (p.kw.some(k => text.includes(k)) && !seen.has(p.key)) { seen.add(p.key); badges.push({key:p.key,label:p.label,cls:p.cls}); } });
  const langs = repos.map(r=>(r.language||"").toLowerCase());
  LANGS.forEach(l => { if ((langs.includes(l)||text.includes(l)) && !seen.has("lang-"+l)) { seen.add("lang-"+l); badges.push({key:"lang-"+l,label:LANG_LABELS[l]||l,cls:"bdg-lang"}); } });
  if (["defi","dex","amm","lending","vault","yield","liquidity"].some(w=>text.includes(w)) && !seen.has("defi")) { seen.add("defi"); badges.push({key:"defi",label:"DeFi",cls:"bdg-defi"}); }
  return badges;
}

function calcScore(c) {
  const days = c.daysSince || 999;
  const rec = days < 30 ? 40 : days < 90 ? 25 : days < 180 ? 10 : 0;
  const com = Math.min(40, Math.floor(Math.log2((c.contributions||0)+1)*6));
  const rep = Math.min(20, c.publicRepos||0);
  return Math.min(99, rec+com+rep);
}

function scoreColor(s) { return s>=70?"var(--a)":s>=40?"var(--amber)":"var(--t3)"; }

function actInfo(c) {
  const d = c.daysSince;
  if (!d || d<30) return {cls:"ahot",col:"var(--teal)",txt:"Active now"};
  if (d<90) return {cls:"awarm",col:"var(--amber)",txt:Math.round(d)+"d ago"};
  return {cls:"acold",col:"var(--t3)",txt:Math.round(d)+"d ago"};
}

function liUrl(c) {
  const n = c.name && c.name!==c.login ? c.name : c.login;
  return "https://www.google.com/search?q="+encodeURIComponent('"'+n+'" site:linkedin.com/in');
}

function dlFile(name, content, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content],{type}));
  a.download = name; a.click();
}

// ── Bug Reporter ──
// ⚙ Replace YOUR_FORMSPREE_ID below with your actual form ID from formspree.io
const FORMSPREE_ENDPOINT = "https://formspree.io/f/YOUR_FORMSPREE_ID";

async function submitBugReport() {
  const { bugCategory, bugTitle, bugDescription, bugSteps, bugEmail } = state;
  if (!bugCategory) { setState({bugError:"Please select a category."}); return; }
  if (!bugTitle.trim()) { setState({bugError:"Please add a short title."}); return; }
  if (!bugDescription.trim()) { setState({bugError:"Please describe the bug."}); return; }

  setState({bugSubmitting:true, bugError:""});

  // Auto-capture context to help with debugging
  const context = [
    "Mode: " + state.mode,
    state.repoInfo ? "Repo: " + state.repoInfo.full_name : (state.repoInput ? "Repo input: " + state.repoInput : ""),
    "Contributors loaded: " + state.contributors.length,
    "Company: " + (state.selectedCompany ? state.selectedCompany.name : "none"),
    "Browser: " + navigator.userAgent.split(") ")[0].split(" (")[1] || navigator.userAgent.slice(0,60),
    "Viewport: " + window.innerWidth + "×" + window.innerHeight,
    "Time: " + new Date().toISOString(),
    "Token active: " + (!!sessionStorage.getItem("rr_token"))
  ].filter(Boolean).join("\n");

  const payload = {
    category: bugCategory,
    title: bugTitle,
    description: bugDescription,
    steps: bugSteps || "(not provided)",
    "reporter-email": bugEmail || "(not provided)",
    "auto-context": context
  };

  try {
    const res = await fetch(FORMSPREE_ENDPOINT, {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const d = await res.json().catch(()=>({}));
      throw new Error(d.error || "Submission failed ("+res.status+")");
    }
    setState({bugSubmitting:false, bugDone:true, bugError:"",
      bugCategory:"", bugTitle:"", bugDescription:"", bugSteps:"", bugEmail:""});
  } catch(e) {
    setState({bugSubmitting:false, bugError:e.message || "Network error — please try again."});
  }
}

// ── Outreach Generator (org-agnostic) ──
function generateOutreach(c, tone, repoInfo, jd) {
  const first = c.name && c.name!==c.login ? c.name.split(" ")[0] : c.login;
  const bl = (c.badges||[]).map(b=>b.label);
  const commits = (c.contributions||0).toLocaleString();
  const repoFull = repoInfo ? repoInfo.full_name : "the repository";
  const repoShort = repoInfo ? repoInfo.name : "this project";
  const active = c.daysSince && c.daysSince < 60;

  const hasSol = bl.some(b=>["Solidity","ETH","DeFi"].includes(b));
  const hasRust = bl.includes("Rust");
  const hasCross = bl.some(b=>["DOT","Cosmos","NEAR","AVAX","SOL"].includes(b));
  const hasDefi = bl.includes("DeFi");
  const hasZK = bl.some(b=>["ZK","Cairo","Move"].includes(b));

  // ── JD-AWARE GENERATION ──
  if (jd) {
    const co = jd.company || 'the company';
    const jdRole = jd.role || 'engineer';
    const jdStack = jd.stack || [];
    const jdSkills = jd.skills || [];
    const jdSelling = jd.selling_points || [];

    const candidateBadges = (c.badges || []).map(b => b.label.toLowerCase());
    const stackMatches = jdStack.filter(s => candidateBadges.some(b => b.includes(s.toLowerCase()) || s.toLowerCase().includes(b)));
    const skillMatches = jdSkills.filter(s => candidateBadges.some(b => b.includes(s.toLowerCase().split(' ')[0])));
    const allMatches = [...new Set([...stackMatches, ...skillMatches])];

    let matchSentence = '';
    if (allMatches.length >= 2) {
      matchSentence = 'Your ' + allMatches[0] + ' and ' + allMatches[1] + ' background maps directly onto what we need.';
    } else if (allMatches.length === 1) {
      matchSentence = 'Your ' + allMatches[0] + ' experience is directly relevant to what we\'re building.';
    } else if (jdStack.length > 0) {
      matchSentence = 'The role is heavy on ' + jdStack.slice(0,2).join(' and ') + ', and your GitHub work shows serious depth there.';
    } else {
      matchSentence = 'Your open source work on ' + repoShort + ' caught my eye while I was sourcing for this role.';
    }

    const jdResponsibilities = jd.responsibilities || [];
    let roleSentence = '';
    if (jdResponsibilities.length > 0) {
      const resp = jdResponsibilities[0].replace(/^[-•*▸➜>·]\s*/,'').trim();
      if (resp.length > 20) roleSentence = resp.charAt(0).toUpperCase() + resp.slice(1);
    }
    if (!roleSentence) {
      if (jdSkills.length > 0 && jdStack.length > 0) {
        roleSentence = 'The role involves ' + jdSkills.slice(0,2).join(' and ') + ' work, primarily in ' + jdStack.slice(0,2).join(' and ') + '.';
      } else if (jdSkills.length > 0) {
        roleSentence = 'The work is centred on ' + jdSkills.slice(0,3).join(', ') + '.';
      } else if (jdStack.length > 0) {
        roleSentence = "It's a " + jdStack.slice(0,2).join('/') + '-heavy role with a serious engineering bar.';
      } else {
        roleSentence = "It's a strong role with real scope and ownership.";
      }
    }

    let sellSentence = '';
    if (jdSelling.length > 0) {
      const raw = jdSelling[0].replace(/^[-•*▸➜>]\s*/,'').trim();
      sellSentence = raw.length > 20 ? raw : (jdSelling[1] ? jdSelling[1].replace(/^[-•*▸➜>]\s*/,'').trim() : '');
    }
    if (!sellSentence) {
      const perks = [];
      if (/remote/i.test(jdSelling.join(' '))) perks.push('fully remote');
      if (/equity/i.test(jdSelling.join(' '))) perks.push('equity');
      if (/funded|series|seed/i.test(jdSelling.join(' '))) perks.push('well-funded');
      sellSentence = perks.length ? co + ' is ' + perks.join(', ') + '.' : '';
    }

    const actLine = active ? "I can see you've been shipping consistently recently — " : "I know you may have a lot on, but ";

    if (tone === 'linkedin') {
      let msg;
      if (allMatches.length > 0) {
        msg = 'Hi ' + first + ', your ' + allMatches[0] + ' work on ' + repoShort + ' stood out while I was sourcing for a ' + jdRole + ' at ' + co + '. ' + (sellSentence || roleSentence) + ' Worth a quick chat?';
      } else {
        msg = 'Hi ' + first + ', I came across your work on ' + repoShort + ' while sourcing for a ' + jdRole + ' role at ' + co + '. ' + roleSentence + ' Would love to connect.';
      }
      if (msg.length > 300) msg = msg.slice(0, 297).replace(/\s\S+$/, '') + '...';
      return msg;
    }

    if (tone === 'story') {
      return (
        'Hi ' + first + ',\n\n' +
        'I\'ll be straight with you — I found you through your GitHub contributions to ' + repoFull + (commits > 20 ? ' — ' + commits + ' commits is a serious body of work' : '') + '. It\'s exactly the kind of signal I look for.\n\n' +
        matchSentence + ' I\'m recruiting for a ' + jdRole + ' at ' + co + '. ' + roleSentence + '\n\n' +
        (sellSentence ? sellSentence + '\n\n' : '') +
        actLine + 'would you be open to a 20-minute call? I\'m happy to send the full JD first if that\'s easier.\n\n' +
        '[Your name]\n[Your title] | ' + co + ' Talent'
      );
    }

    // Direct tone
    return (
      'Hi ' + first + ',\n\n' +
      'I came across your work on ' + repoFull + (commits > 10 ? ' (' + commits + ' commits)' : '') + ' while sourcing for a ' + jdRole + ' at ' + co + '.\n\n' +
      matchSentence + ' ' + roleSentence + '\n\n' +
      (sellSentence ? sellSentence + '\n\n' : '') +
      actLine + 'would you be open to a 20-minute call to hear more?\n\n' +
      '[Your name]\n[Your title] | ' + co + ' Talent'
    );
  }

  // ── GENERIC DEFAULT (no JD loaded) ──
  // Build a tailored hook based on the candidate's detected signals
  let hook, role;

  if (hasZK && hasRust) {
    hook = "Your ZK and Rust work on " + repoShort + " is exactly the kind of signal we look for — low-level cryptographic engineering at production scale is rare.";
    role = "ZK / systems engineer";
  } else if (hasCross && hasRust) {
    hook = "Your cross-chain and Rust work on " + repoShort + " stood out. We're building multi-chain infrastructure and this combination is hard to find.";
    role = "protocol / systems engineer";
  } else if (hasSol && hasDefi) {
    hook = "Your Solidity and DeFi contributions — including " + repoShort + " — show you understand protocol design at a level most candidates don't.";
    role = "smart contract / protocol engineer";
  } else if (hasRust) {
    hook = "Your Rust work on " + repoShort + " — " + commits + " commits — is a serious body of production-quality open source code.";
    role = "distributed systems / Rust engineer";
  } else if (hasCross) {
    hook = "Your multi-chain background — evident from " + repoShort + " — maps well onto a role we're hiring for. Cross-ecosystem depth is genuinely uncommon.";
    role = "cross-chain protocol engineer";
  } else if (hasSol) {
    hook = "Your Solidity contributions to " + repoShort + " show you know how to write smart contracts that matter. That's the baseline for this role.";
    role = "smart contract engineer";
  } else {
    hook = "Your open source work on " + repoShort + " — " + commits + " commits — is exactly the kind of track record we look for when sourcing.";
    role = "senior engineer";
  }

  const actLine = active ? "I can see you've been actively shipping recently — " : "I know you may have a lot on, but ";

  if (tone === "linkedin") {
    let msg;
    if (hasZK && hasRust) msg = "Hi " + first + ", your ZK/Rust work on " + repoShort + " caught my eye. I recruit web3 engineers and this profile is exactly what I'm sourcing for right now. Worth connecting?";
    else if (hasCross && hasRust) msg = "Hi " + first + ", cross-chain Rust work on " + repoShort + " is a rare combo — I recruit for that exact profile. Would love to connect.";
    else if (hasSol && hasDefi) msg = "Hi " + first + ", your Solidity/DeFi work on " + repoShort + " stood out. I recruit protocol engineers — worth a quick chat?";
    else if (hasRust) msg = "Hi " + first + ", saw your Rust contributions to " + repoShort + ". I recruit web3 engineers with systems depth — would love to connect.";
    else if (hasSol) msg = "Hi " + first + ", your Solidity work on " + repoShort + " is exactly what I'm sourcing for. I recruit smart contract engineers — worth connecting?";
    else msg = "Hi " + first + ", " + commits + " commits to " + repoShort + " is a strong signal. I recruit web3 engineers — would love to connect.";
    if (msg.length > 300) msg = msg.slice(0,297).replace(/\s\S+$/,"") + "...";
    return msg;
  }

  if (tone === "story") {
    return (
      "Hi " + first + ",\n\n" +
      "I'll be upfront — I found you through your GitHub contributions to " + repoFull + ". " + (commits > 20 ? commits + " commits is a serious body of work, and the quality is clear." : "The work is exactly the kind of signal I look for.") + "\n\n" +
      hook + "\n\n" +
      "I'm a recruiter sourcing for a " + role + " role. I'd rather reach out to the right person than spray and pray — which is why I'm here, not on LinkedIn mass-messaging.\n\n" +
      actLine + "I think your background is a strong match. Would you be open to a 20-minute call? Happy to share full details first if that's easier.\n\n" +
      "[Your name]\n[Your title] | [Your organisation]"
    );
  }

  // Direct (default)
  return (
    "Hi " + first + ",\n\n" +
    "I came across your work on " + repoFull + " — " + commits + " commits is a strong signal.\n\n" +
    hook + "\n\n" +
    "I'm recruiting for a " + role + " role. The team is remote-friendly and working on infrastructure that genuinely matters.\n\n" +
    actLine + "would you be open to a 20-minute call? Happy to share the full details first.\n\n" +
    "[Your name]\n[Your title] | [Your organisation]"
  );
}

// ── JD Parser (client-side) ──
function parseJD(text) {
  if (!text || text.trim().length < 20) return null;
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

  const noiseRx = /compensation|salary|bonus|cash|disclaimer|note:|equal opportunity|eeo|applicant|privacy|cookie|apply now|click here|©|all rights reserved|terms of|powered by|lever|greenhouse|workday|requisition|job id|#|posted|updated|view all/i;
  const cleanLines = lines.filter(l => !noiseRx.test(l) && l.length > 3);

  const titleRx = /engineer|developer|manager|lead|analyst|architect|designer|recruiter|scientist|researcher|specialist|director|vp |head of/i;
  const titleLine = cleanLines.find(l => titleRx.test(l) && l.length < 60)
    || cleanLines.find(l => titleRx.test(l) && l.length < 90);
  let role = (titleLine || cleanLines[0] || 'Engineer').replace(/\s+(?:at|@)\s+\S+.*$/i,'').replace(/,\s+[A-Z][a-z]{2,}.*$/,'').trim().slice(0,60);

  let company = '';
  const m1 = text.match(/^([A-Z][A-Za-z0-9 &.]{1,30}?) is (?:a |an |the )/m);
  const m2 = text.match(/(?:join(?:ing)?)\s+([A-Z][A-Za-z0-9 &.]{1,30})(?:\s|[,.]|$)/);
  const m3 = text.match(/\bat\s+([A-Z][A-Za-z0-9 &.]{1,30})(?:\s+(?:we|our|is|are)|\s*[,.])/);
  const m4 = text.match(/(?:about|who we are)[:\s]+([A-Z][A-Za-z0-9 &.]{1,30})/i);
  const firstLine = cleanLines[0] || '';
  const m5 = firstLine.length < 40 && /^[A-Z]/.test(firstLine) && !titleRx.test(firstLine) ? firstLine : null;

  if (m1 && m1[1] && m1[1].trim().length > 1) company = m1[1].trim();
  else if (m4 && m4[1]) company = m4[1].trim();
  else if (m2 && m2[1]) company = m2[1].trim();
  else if (m3 && m3[1]) company = m3[1].trim();
  else if (m5) company = m5.trim();
  if (!company) company = 'the company';

  const allTechs = ['Solidity','Rust','Go','TypeScript','JavaScript','Python','Java','Kotlin','Swift','React','Node','GraphQL','Kubernetes','Docker','AWS','GCP','PostgreSQL','Redis','Kafka','WASM','ZK','EVM','Cosmos','Substrate','Move','Cairo'];
  const stack = allTechs.filter(k => text.toLowerCase().indexOf(k.toLowerCase()) >= 0);
  if (text.indexOf('C++') >= 0) stack.push('C++');

  const allSigs = ['smart contracts','DeFi','cross-chain','distributed systems','protocol','consensus','cryptography','zero knowledge','MEV','oracle','Layer 2','rollup','staking','on-chain','blockchain','web3','infrastructure','security'];
  const skills = allSigs.filter(k => text.toLowerCase().indexOf(k.toLowerCase()) >= 0).slice(0,6);

  const sellPositive = /remote|equity|ownership|impact|mission|funded|backed|innovative|cutting.edge|passionate|world.class|leading|fast.growing|well.funded|seed|series [a-d]|top.tier|high.impact|scaling|billions|millions/i;
  const sellNegative = /compensation range|salary range|note:|disclaimer|eeo|equal opportunity|applicant|we are an|we're an|the company is|reduce|improve|strengthen|silo|documentation|knowledge transfer|operational/i;
  const selling = cleanLines.filter(l => sellPositive.test(l) && !sellNegative.test(l) && l.length > 20 && l.length < 140).slice(0,3);

  const doRx = /you.?ll|you will|responsible for|own|build|design|architect|lead|develop|drive|create|ship/i;
  const doLines = cleanLines.filter(l => doRx.test(l) && !noiseRx.test(l) && l.length > 20 && l.length < 120).slice(0,2);

  const seniority = /junior|entry|graduate|intern/i.test(text) ? 'junior'
    : /senior|staff|principal|lead|head|director|vp/i.test(text) ? 'senior' : 'mid';

  return { role, company, stack, skills, selling_points: selling, responsibilities: doLines, seniority };
}

  if (patch.notes !== undefined) localStorage.setItem("rr_notes", JSON.stringify(state.notes));

    else sessionStorage.removeItem("rr_token");
  }
  render();

function pushNav(toMode) {
  if (state.mode !== toMode) state.navHistory.push(state.mode);
  state.navFuture = [];
}
function navBack() {
  if (!state.navHistory.length) return;
  state.navFuture.push(state.mode);
  setState({mode: state.navHistory.pop()});
}
function navForward() {
  if (!state.navFuture.length) return;
  state.navHistory.push(state.mode);
  setState({mode: state.navFuture.pop()});
}
function setStateQuiet(patch) {
  Object.assign(state, patch);
  if (patch.tokenInput !== undefined) {
    if (patch.tokenInput.trim()) sessionStorage.setItem("rr_token", patch.tokenInput.trim());

// ── API Helpers ──
function getHeaders() {
  const token = sessionStorage.getItem("rr_token") || state.tokenInput.trim();
  return token ? {"Authorization":"Bearer "+token} : {};
}

async function fetchRepo() {
  const input = state.repoInput.trim();
  if (!input.includes("/")) { setState({error:"Enter a valid repo as owner/repository — e.g. Uniswap/v3-core"}); return; }
  const [owner, repo] = input.split("/").map(s=>s.trim());
  if (!owner||!repo) { setState({error:"Enter a valid repo as owner/repository"}); return; }
  const h = getHeaders();
  setState({loading:true,loadingText:"Fetching repository info...",loadingSub:"",error:"",contributors:[],repoInfo:null,
    reviewers:[],reviewersLoaded:false,reviewersLoading:false,showReviewerView:false,expandedNote:null});

  try {
    const rr = await fetch("https://api.github.com/repos/"+owner+"/"+repo, {headers:h});
    if (!rr.ok) {
      const e = await rr.json().catch(()=>({}));
      throw new Error(rr.status===404?"Repository not found — check the spelling":rr.status===403?"Rate limit hit — add a GitHub token to continue":rr.status===401?"Invalid GitHub token":e.message||"GitHub API error ("+rr.status+")");
    }
    const rd = await rr.json();
    setState({repoInfo:rd,loadingText:"Fetching contributors...",loadingSub:"Paginating commit history"});

    let all = [];
    for (let p=1;p<=5;p++) {
      const cr = await fetch("https://api.github.com/repos/"+owner+"/"+repo+"/contributors?per_page=100&page="+p+"&anon=false",{headers:h});
      if (!cr.ok) { const e=await cr.json().catch(()=>({})); throw new Error(e.message||"Failed to fetch contributors"); }
      const cd = await cr.json();
      if (!Array.isArray(cd)||cd.length===0) break;
      all = all.concat(cd);
      if (cd.length<100) break;
    }
    if (all.length===0) throw new Error("No contributors found for this repository.");

    setState({loadingText:"Enriching "+all.length+" profiles...",loadingSub:"Fetching activity, languages & web3 signals"});
    const enriched = [];
    for (let i=0;i<all.length;i+=6) {
      const batch = all.slice(i,i+6);
      const res = await Promise.all(batch.map(async c => {
        try {
          const [pr,rr2] = await Promise.all([
            fetch("https://api.github.com/users/"+c.login,{headers:h}),
            fetch("https://api.github.com/users/"+c.login+"/repos?per_page=30&sort=updated",{headers:h})
          ]);
          const p = pr.ok ? await pr.json() : {};
          const repos = rr2.ok ? await rr2.json() : [];
          const lastPush = Array.isArray(repos)&&repos.length ? repos[0].pushed_at : null;
          const daysSince = lastPush ? (Date.now()-new Date(lastPush).getTime())/86400000 : null;
          const rlist = Array.isArray(repos)?repos:[];
          return { login:c.login, avatar_url:c.avatar_url, html_url:c.html_url, contributions:c.contributions,
            name:p.name||c.login, email:p.email||null, location:p.location||null,
            company:p.company||null, bio:p.bio||null, publicRepos:p.public_repos||0,
            daysSince, sourceCount:rlist.filter(r=>!r.fork).length, forkCount:rlist.filter(r=>r.fork).length, badges:detectBadges(rlist) };
        } catch {
          return {login:c.login,avatar_url:c.avatar_url,html_url:c.html_url,contributions:c.contributions,name:c.login,email:null,location:null,company:null,bio:null,publicRepos:0,daysSince:null,badges:[]};
        }
      }));
      enriched.push(...res);
      setState({loadingText:"Enriched "+Math.min(i+6,all.length)+" / "+all.length+" profiles..."});
    }
    setState({loading:false,contributors:enriched});
    setTimeout(()=>{ const a=document.getElementById("results-anchor"); if(a) a.scrollIntoView({behavior:"smooth",block:"start"}); },120);
  } catch(e) {
    setState({loading:false,error:e.message});
  }
}

function aiSearch() {
  const q = state.aiQuery.toLowerCase().trim();
  if (!q) return;
  const scored = Object.entries(KB).map(([role,data]) => {
    const words = q.split(" ").filter(w=>w.length>2);
    const s = role.split(" ").filter(w=>words.includes(w)).length*2 + data.tags.filter(t=>words.some(w=>t.toLowerCase().includes(w))).length + (q.includes(role)?5:0);
    return {role,data,s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);

  const results = [];
  const src = scored.length ? scored.slice(0,3) : Object.entries(KB).slice(0,3).map(([role,data])=>({role,data}));
  src.forEach(({data}) => data.repos.slice(0,3).forEach(repo => results.push({repo,reason:data.reason,tags:data.tags})));
  setState({aiSuggs:results});
}

function getFiltered() {
  return state.contributors.filter(c => {
    if (state.filter==="email"&&!c.email) return false;
    if (state.filter==="active"&&(!c.daysSince||c.daysSince>90)) return false;
    if (state.filter==="saved"&&!state.saved[c.login]) return false;
    if (state.langFilter!=="all"&&!c.badges.some(b=>b.key==="lang-"+state.langFilter||b.key===state.langFilter)) return false;
    if (state.textFilter) {
      const q=state.textFilter.toLowerCase();
      if (![(c.name||""),(c.login||""),(c.location||""),(c.company||""),(c.bio||"")].some(v=>v.toLowerCase().includes(q))) return false;
    }
    return true;
  });
}

async function openProfile(c) {
  setState({profileOpen:c,noteText:state.notes[c.login]||"",outreachMsg:"",outreachCopied:false});
  if (!state.profileRepos[c.login]) {
    try {
      const r = await fetch("https://api.github.com/users/"+c.login+"/repos?per_page=6&sort=stars",{headers:getHeaders()});
      const repos = r.ok ? await r.json() : [];

      setState({profileRepos:pr});

}

  navigator.clipboard.writeText(state.outreachMsg).then(()=>{
    setState({outreachCopied:true});
    setTimeout(()=>setState({outreachCopied:false}),2000);
  }).catch(()=>{});
}

// ── Company Functions ──
async function fetchCompanyRepos(org) {
  const token = sessionStorage.getItem("rr_token") || state.tokenInput.trim();
  setState({companyRepos:[], selectedRepos:[], multiContributors:[], multiLoading:false, error:""});

  const doFetch = async (url) => {
    const opts = token ? {headers:{"Authorization":"Bearer "+token}} : {};
    const res = await fetch(url, opts);
    if (res.status === 401) throw new Error("Token rejected (401) — your token may be expired. Re-save it using Add Token in the header.");
    if (res.status === 403) {
      const b = await res.json().catch(()=>({}));
      throw new Error((b.message||"").toLowerCase().includes("rate limit")
        ? "GitHub rate limit hit — please add or refresh your token using Add Token in the header."
        : "GitHub access denied (403). "+(b.message||""));
    }
    if (res.status === 404) return null;
    if (!res.ok) throw new Error("GitHub returned "+res.status+" for "+org);
    return res.json();
  };

  try {
    let repos = await doFetch("https://api.github.com/orgs/"+org+"/repos?per_page=100&sort=updated&type=public");
    if (repos === null) repos = await doFetch("https://api.github.com/users/"+org+"/repos?per_page=100&sort=updated&type=public");
    if (repos === null) { setState({error:"Could not find org: "+org+" on GitHub."}); return; }
    const filtered = Array.isArray(repos) ? repos.filter(r=>!r.fork).sort((a,b)=>b.stargazers_count-a.stargazers_count) : [];
    if (!filtered.length) { setState({error:"No public repos found for "+org}); return; }
    setState({companyRepos:filtered, error:""});
  } catch(e) {
    setState({error:e.message});
  }
}

function toggleRepoSelection(repo) {

        ]);
        const p = pr.ok ? await pr.json() : {};
        const repos2 = rr.ok ? await rr.json() : [];

          company:p.company||null, bio:p.bio||null, publicRepos:p.public_repos||0,

// ── PR Reviewer Fetcher ──
async function fetchReviewers() {
  const h = getHeaders();
  const hasToken = !!(sessionStorage.getItem("rr_token") || state.tokenInput.trim());
  const maxPRsPerRepo = hasToken ? 100 : 20;

  // Work out which repos to scan — single repo search or multi-repo company results
  const reposToScan = state.repoInfo
    ? [state.repoInfo.full_name]
    : state.selectedRepos.map(r => r.full_name);
  if (!reposToScan.length) return;

  setState({reviewersLoading:true, reviewerLoadText:"Fetching recent PRs...", reviewers:[], reviewersLoaded:false});

  try {
    const reviewerMap = {};

    for (const fullName of reposToScan) {
      // Step 1: fetch closed PRs for this repo
      let prs = [];
      setState({reviewerLoadText:"Fetching PRs from "+fullName+"..."});
      for (let p = 1; p <= 2; p++) {
        const res = await fetch("https://api.github.com/repos/"+fullName+"/pulls?state=closed&per_page="+Math.min(maxPRsPerRepo,100)+"&page="+p, {headers:h});
        if (!res.ok) break;
        const data = await res.json();
        prs = prs.concat(data);
        if (data.length < 100 || prs.length >= maxPRsPerRepo) break;
      }
      if (!prs.length) continue;

      // Step 2: fetch reviews for each PR in batches of 8
      for (let i = 0; i < prs.length; i += 8) {
        setState({reviewerLoadText:"Reading reviews — "+fullName+" PRs "+(i+1)+"–"+Math.min(i+8,prs.length)+" of "+prs.length+"..."});
        const batch = prs.slice(i, i+8);
        const results = await Promise.all(batch.map(pr =>
          fetch("https://api.github.com/repos/"+fullName+"/pulls/"+pr.number+"/reviews", {headers:h})
            .then(r => r.ok ? r.json() : []).catch(() => [])
        ));
        results.forEach(reviews => {
          reviews.forEach(rv => {
            if (!rv.user || rv.user.type==="Bot" || rv.user.login.includes("[bot]")) return;
            const login = rv.user.login;
            if (!reviewerMap[login]) reviewerMap[login] = {
              login, avatar_url:rv.user.avatar_url, html_url:rv.user.html_url,
              name:rv.user.login, email:null, location:null, company:null, bio:null,
              publicRepos:0, daysSince:null, badges:[], contributions:0,
              approvals:0, totalReviews:0, lastReviewAt:null
            };
            reviewerMap[login].totalReviews++;
            if (rv.state==="APPROVED") reviewerMap[login].approvals++;
            if (!reviewerMap[login].lastReviewAt || rv.submitted_at > reviewerMap[login].lastReviewAt)
              reviewerMap[login].lastReviewAt = rv.submitted_at;
          });
        });
      }
    } // end per-repo loop

    if (!Object.keys(reviewerMap).length) { setState({reviewersLoading:false, reviewersLoaded:true, reviewers:[]}); return; }

    // Step 3: sort by approvals, cross-reference with contributors
    const contribLogins = new Set(state.contributors.map(c => c.login));
    let sorted = Object.values(reviewerMap)
      .filter(r => r.approvals > 0)
      .sort((a, b) => b.approvals - a.approvals)
      .map(r => ({
        ...r,
        isContributor: contribLogins.has(r.login),
        daysSince: r.lastReviewAt ? (Date.now()-new Date(r.lastReviewAt).getTime())/86400000 : null
      }));

    // Step 4: enrich top 20 profiles (name, location, company, badges)
    setState({reviewerLoadText:"Enriching top reviewer profiles..."});
    for (let i = 0; i < Math.min(sorted.length, 20); i += 6) {
      const batch = sorted.slice(i, i+6);
      const enriched = await Promise.all(batch.map(async r => {
        try {
          const [pu, ru] = await Promise.all([
            fetch("https://api.github.com/users/"+r.login, {headers:h}),
            fetch("https://api.github.com/users/"+r.login+"/repos?per_page=30&sort=updated", {headers:h})
          ]);
          const p = pu.ok ? await pu.json() : {};
          const repos = ru.ok ? await ru.json() : [];
          return { ...r,
            name:p.name||r.login, email:p.email||null, location:p.location||null,
            company:p.company||null, bio:p.bio||null, publicRepos:p.public_repos||0,
            badges:detectBadges(Array.isArray(repos)?repos:[])
          };
        } catch { return r; }
      }));
      enriched.forEach((r, idx) => { sorted[i+idx] = r; });
    }

    setState({reviewers:sorted, reviewersLoading:false, reviewersLoaded:true, reviewerLoadText:""});
  } catch(e) {
    setState({reviewersLoading:false, reviewersLoaded:false, reviewerLoadText:"", error:"Reviewer fetch failed: "+e.message});
  }
}

// ── DOM Builder ──
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k==="className") e.className=v;
    else if (k==="style"&&typeof v==="object") Object.assign(e.style,v);
    else if (k.startsWith("on")&&typeof v==="function") e.addEventListener(k.slice(2).toLowerCase(),v);
    else if (k==="htmlFor") e.htmlFor=v;
    else if (k==="checked") e.checked=v;
    else if (k==="disabled") e.disabled=v;
    else if (k==="readOnly") e.readOnly=v;
    else if (k==="value"&&(tag==="input"||tag==="textarea")) e.value=v;
    else e.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(ch => {
    if (ch==null||ch===false) return;
    e.appendChild(typeof ch==="string"||typeof ch==="number" ? document.createTextNode(String(ch)) : ch);
  });
  return e;
}

        c.badges&&c.badges.length?el("div",{className:"psec"},el("div",{className:"psect"},"Web3 Signals"),el("div",{style:{display:"flex",flexWrap:"wrap",gap:"6px"}},...c.badges.map(b=>el("span",{className:"bdg "+b.cls,style:{fontSize:"11px",padding:"5px 10px"}},b.label)))):null,
        el("div",{className:"psec"},
          el("div",{className:"psect"},"Activity Score"),
          el("div",{style:{display:"flex",alignItems:"center",gap:"16px"}},
            el("span",{style:{fontFamily:"'Inter',system-ui,sans-serif",fontSize:"46px",fontWeight:"800",color:scoreColor(score)}},score),
            el("div",{},
              el("div",{style:{fontSize:"11px",color:"var(--t2)",marginBottom:"6px"}},"Based on recency, commit volume & repo diversity"),
              el("div",{style:{display:"flex",gap:"10px",fontSize:"10px",color:"var(--t3)"}},
                el("span",{},"⚡ "+(c.contributions||0)+" commits to this repo"),
                c.daysSince?el("span",{},"🕐 Last active "+Math.round(c.daysSince)+"d ago"):null
              )
            )
          )
        ),
        el("div",{className:"psec"},el("div",{className:"psect"},"Top Repositories"),repoCds),
        el("div",{className:"psec"},
          el("div",{className:"psect"},"✦ Outreach"),
          el("div",{style:{marginBottom:"14px",background:"var(--surface2)",border:"1px solid var(--b1)",borderRadius:"8px",padding:"14px"}},
            el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}},
              el("div",{style:{fontSize:"11px",color:"var(--t2)",fontWeight:"600"}},"Job Description ",
                state.jdContext ? el("span",{style:{color:"var(--teal)",fontWeight:"400"}},"· parsed") : el("span",{style:{color:"var(--t4)",fontWeight:"400"}},"· optional")
              ),
              state.jdContext ? el("button",{style:{background:"transparent",border:"1px solid var(--b2)",borderRadius:"4px",color:"var(--t3)",cursor:"pointer",fontSize:"10px",padding:"3px 8px",fontFamily:"var(--font-ui)"},onClick:()=>setState({jdContext:null,jdText:"",jdUrl:"",outreachMsg:""})},"× Clear") : null
            ),
            !state.jdContext ? el("div",{},
              el("textarea",{id:"jd-paste-input",placeholder:"Paste the full job description here — role title, required skills, tech stack, selling points. Outreach will be tailored to this role.",style:{width:"100%",background:"var(--surface)",border:"1px solid var(--b2)",borderRadius:"6px",color:"var(--t)",fontFamily:"var(--font-ui)",fontSize:"12px",lineHeight:"1.6",padding:"10px 12px",outline:"none",resize:"vertical",minHeight:"90px"},onInput:e=>{ _jdDraftText=e.target.value; }}),
              el("button",{style:{marginTop:"8px",background:"var(--navy)",border:"none",borderRadius:"6px",color:"#fff",cursor:"pointer",fontFamily:"var(--font-ui)",fontSize:"11px",fontWeight:"600",padding:"8px 16px"},onClick:()=>{
                const jdEl=document.getElementById('jd-paste-input');
                const txt=(jdEl?jdEl.value:'')||_jdDraftText||'';
                if(!txt||txt.trim().length<20){ setState({jdError:'Paste the job description text above, then click Parse.'}); return; }
                _jdDraftText=txt;
                const parsed=parseJD(txt);
                if(parsed) setState({jdContext:parsed,jdError:'',outreachMsg:''});
                else setState({jdError:'Could not extract details — paste more of the JD text.'});
              }},"Parse JD →"),
              state.jdError ? el("div",{style:{fontSize:"11px",color:"var(--warn)",marginTop:"6px"}},state.jdError) : null
            ) : el("div",{},
              el("div",{style:{background:"var(--teal-light)",border:"1px solid rgba(87,146,255,0.25)",borderRadius:"8px",padding:"14px 16px",marginBottom:"10px"}},
                el("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"10px"}},
                  el("span",{style:{fontSize:"16px"}},"✓ "),
                  el("span",{style:{fontSize:"13px",color:"var(--teal)",fontWeight:"700"}},"JD parsed — outreach will be tailored to this role")
                ),
                el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"}},
                  el("div",{},
                    el("div",{style:{fontSize:"9px",color:"var(--t3)",fontWeight:"700",textTransform:"uppercase",letterSpacing:"1px",marginBottom:"3px"}},"Role"),
                    el("div",{style:{fontSize:"13px",fontWeight:"600",color:"var(--navy)"}},state.jdContext.role)
                  ),
                  el("div",{},
                    el("div",{style:{fontSize:"9px",color:"var(--t3)",fontWeight:"700",textTransform:"uppercase",letterSpacing:"1px",marginBottom:"3px"}},"Company"),
                    el("div",{style:{fontSize:"13px",fontWeight:"600",color:"var(--navy)"}},state.jdContext.company)
                  ),
                  el("div",{},
                    el("div",{style:{fontSize:"9px",color:"var(--t3)",fontWeight:"700",textTransform:"uppercase",letterSpacing:"1px",marginBottom:"3px"}},"Tech Stack"),
                    el("div",{style:{fontSize:"12px",color:"var(--t2)"}},(state.jdContext.stack||[]).length ? state.jdContext.stack.slice(0,5).join(", ") : el("span",{style:{color:"var(--t4)",fontStyle:"italic"}},"not detected"))
                  ),
                  el("div",{},
                    el("div",{style:{fontSize:"9px",color:"var(--t3)",fontWeight:"700",textTransform:"uppercase",letterSpacing:"1px",marginBottom:"3px"}},"Key Signals"),

              )
            )
          ),
          toneRow,
          msgArea
        ),
        el("div",{className:"psec"},
          el("div",{className:"psect"},"Recruiter Notes"),
          el("textarea",{className:"narea",placeholder:"Interview stage, fit assessment, follow-up date...",value:state.noteText,onInput:e=>setStateQuiet({noteText:e.target.value})}),
          el("button",{className:"nsave",onClick:()=>setState({notes:{...state.notes,[c.login]:state.noteText},profileOpen:null})},"Save Note")
        ),
        el("div",{style:{display:"flex",gap:"10px",marginTop:"4px",flexWrap:"wrap"}},
          el("a",{className:"libtn",style:{fontSize:"11px",padding:"8px 15px"},href:liUrl(c),target:"_blank"},"Search LinkedIn ↗"),
          el("a",{className:"libtn",style:{fontSize:"11px",padding:"8px 15px"},href:c.html_url,target:"_blank"},"GitHub Profile ↗"),
          el("button",{className:"svbtn"+(state.saved[c.login]?" on":""),style:{fontSize:"15px",padding:"6px 14px"},onClick:()=>{
            const s={...state.saved};
            if(s[c.login])delete s[c.login]; else s[c.login]={login:c.login,name:c.name,avatar_url:c.avatar_url,html_url:c.html_url};
            setState({saved:s,profileOpen:null});
          }},state.saved[c.login]?"★ Saved":"☆ Save")
        )
      )
    );
  }

  // TOKEN MODAL
  let tokenModal = null;
  if (state.showTokenModal) {
    const tinp = el("input",{type:"password",value:state.tokenInput,
      placeholder:"ghp_xxxxxxxxxxxx",
      style:{width:"100%",background:"var(--surface)",border:"1px solid var(--b2)",borderRadius:"5px",color:"var(--t)",fontFamily:"'JetBrains Mono',monospace",fontSize:"13px",padding:"11px 14px",outline:"none",marginBottom:"12px"},
      onInput:e=>setStateQuiet({tokenInput:e.target.value})
    });
    tinp.addEventListener("keydown", e=>{ if(e.key==="Enter") saveToken(); });
    function saveToken() {
      const t = state.tokenInput.trim();
      if (!t) { alert("Please paste your token first."); return; }
      sessionStorage.setItem("rr_token", t);
      setState({tokenInput:t, tokenSaved:true, showTokenModal:false});
    }
    tokenModal = el("div",{className:"overlay",onClick:e=>{ if(e.target===e.currentTarget) setState({showTokenModal:false}); }},
      el("div",{style:{background:"var(--surface)",border:"1px solid var(--b2)",borderRadius:"12px",width:"100%",maxWidth:"500px",padding:"28px",margin:"auto",animation:"sdup .3s ease"}},
        el("div",{className:"dhead"},
          el("div",{className:"dtitle"},"GitHub Token"),
          el("button",{className:"cbtn",onClick:()=>setState({showTokenModal:false})},"✕")
        ),
        el("p",{style:{fontSize:"12px",color:"var(--t2)",marginBottom:"16px",lineHeight:"1.7"}},
          "A Personal Access Token lets you make 5,000 API requests/hour instead of 60. It's required for the Companies tab and recommended for all searches."
        ),
        el("div",{style:{background:"var(--surface2)",border:"1px solid var(--b1)",borderRadius:"6px",padding:"12px 14px",marginBottom:"16px",fontSize:"11px",color:"var(--t3)",lineHeight:"1.7"}},
          "1. Go to ",el("a",{href:"https://github.com/settings/tokens/new?scopes=read:user&description=RepoRecruit",target:"_blank",style:{color:"var(--a)"}},"github.com/settings/tokens/new"),el("br",{}),
          "2. Set any name (e.g. RepoRecruit)",el("br",{}),
          "3. Set expiry (90 days recommended)",el("br",{}),
          "4. Tick ",el("strong",{style:{color:"var(--t)"}},"read:user")," scope only",el("br",{}),
          "5. Click Generate and paste below"
        ),
        tinp,
        el("div",{style:{display:"flex",gap:"10px"}},
          el("button",{className:"sbtn",style:{flex:"1"},onClick:saveToken},"Save Token ✓"),
          el("button",{className:"obtn",onClick:()=>setState({showTokenModal:false})},"Cancel")
        ),
        el("p",{style:{fontSize:"10px",color:"var(--t3)",marginTop:"10px",textAlign:"center"}},"Saved for this browser session only. Never sent anywhere except GitHub's API.")
      )
    );
  }

  // SAVED DRAWER
  let savedDrawer = null;
  if (state.showSaved) {
    const svList = Object.values(state.saved);
    savedDrawer = el("div",{className:"overlay",onClick:e=>{ if(e.target===e.currentTarget)setState({showSaved:false}); }},
      el("div",{className:"drawer"},
        el("div",{className:"dhead"},el("div",{className:"dtitle"},"Saved Candidates ("+svList.length+")"),el("button",{className:"cbtn",onClick:()=>setState({showSaved:false})},"✕")),
        svList.length===0 ? el("div",{className:"empty"},"No saved candidates yet.",el("br",{}),"Click ☆ on any row to save.") :
        el("div",{className:"spanel"},
          ...svList.map(c=>el("div",{className:"svc"},
            el("img",{className:"av",src:c.avatar_url,alt:c.login,style:{width:"38px",height:"38px",cursor:"default"}}),
            el("div",{className:"svc-info"},
              el("div",{className:"svc-name"},c.name||c.login),
              el("a",{className:"svc-handle hlink",href:c.html_url,target:"_blank"},"@"+c.login),
              state.notes[c.login]?el("div",{className:"svc-note"},"📝 "+state.notes[c.login]):null
            ),
            el("button",{className:"unsave",onClick:()=>{
              const s={...state.saved};delete s[c.login];setState({saved:s});
            }},"✕")
          ))
        )
      )
    );
  }

  const footer = el("footer",{},
    el("div",{className:"wrap"},
      "RepoRecruit — Web3 Talent Intelligence · GitHub API · ",
      el("button",{
        onClick:()=>setState({bugReportOpen:true,bugDone:false,bugError:""}),
        style:{background:"none",border:"none",color:"var(--t3)",cursor:"pointer",fontFamily:"var(--font-ui)",fontSize:"11px",padding:"0",textDecoration:"underline",textDecorationStyle:"dotted"}
      },"Report a bug")
    )
  );

  // BUG REPORT MODAL
  let bugModal = null;
  if (state.bugReportOpen) {
    const closeModal = () => setState({bugReportOpen:false,bugDone:false,bugError:""});

    let modalBody;
    if (state.bugDone) {
      modalBody = el("div",{className:"bug-success"},
        el("div",{className:"bug-success-icon"},"✅"),
        el("div",{className:"bug-success-title"},"Report received"),
        el("div",{className:"bug-success-sub"},"Thanks for flagging this. The report has been sent and will be reviewed shortly."),
        el("button",{className:"sbtn",style:{marginTop:"20px"},onClick:closeModal},"Close")
      );
    } else {
      // Auto-fill context label for the reporter's awareness
      const contextNote = [
        state.mode !== "repo" ? "mode: "+state.mode : "",
        state.repoInfo ? "repo: "+state.repoInfo.full_name : (state.repoInput ? "input: "+state.repoInput : ""),
        state.selectedCompany ? "company: "+state.selectedCompany.name : ""
      ].filter(Boolean).join(" · ");

      const catSel = el("select",{className:"bug-select",onInput:e=>setStateQuiet({bugCategory:e.target.value})},
        el("option",{value:""},"— Select a category"),
        ...[
          ["ui",        "UI / display glitch"],
          ["search",    "Search not working"],
          ["data",      "Wrong or missing data"],
          ["outreach",  "Outreach generator issue"],
          ["api",       "GitHub API / rate limit error"],
          ["export",    "Export / CSV issue"],
          ["companies", "Companies tab issue"],
          ["other",     "Other"]
        ].map(([v,l])=>el("option",{value:v},l))
      );
      catSel.value = state.bugCategory;

      const titleInp = el("input",{type:"text",value:state.bugTitle,maxlength:"80",placeholder:"e.g. Avatar images not loading in profile drawer",onInput:e=>setStateQuiet({bugTitle:e.target.value})});

      descTa.value = state.bugDescription;
      const stepsTa = el("textarea",{placeholder:"1. Searched Uniswap/v3-core\n2. Clicked a contributor avatar\n3. Profile drawer opened but images were broken",style:{width:"100%",background:"var(--bg)",border:"1px solid var(--b2)",borderRadius:"6px",color:"var(--t)",fontFamily:"var(--font-ui)",fontSize:"12px",padding:"10px 14px",outline:"none",resize:"vertical",minHeight:"64px",transition:"all .15s"},onInput:e=>setStateQuiet({bugSteps:e.target.value})});

        state.bugError ? el("div",{style:{background:"rgba(192,57,43,0.06)",border:"1px solid rgba(192,57,43,0.2)",borderRadius:"6px",padding:"10px 14px",fontSize:"12px",color:"var(--warn)",marginBottom:"14px"}},"⚠ "+state.bugError) : null,
        el("div",{style:{display:"flex",gap:"10px"}},
          el("button",{
            className:"sbtn",style:{flex:"1",opacity:state.bugSubmitting?0.6:1},
            disabled:state.bugSubmitting,
            onClick:submitBugReport
          }, state.bugSubmitting ? "Sending..." : "Submit Report"),
          el("button",{className:"obtn",onClick:closeModal},"Cancel")
        ),
        el("p",{style:{fontSize:"10px",color:"var(--t4)",marginTop:"10px",textAlign:"center",lineHeight:"1.6"}},
          "Reports are sent via Formspree and visible only to the tool owner. No account needed."
        )
      );
    }

    bugModal = el("div",{
      className:"overlay",
      onClick:e=>{ if(e.target===e.currentTarget) closeModal(); }
    },
      el("div",{className:"bug-modal"},
        el("div",{className:"dhead"},
          el("div",{className:"dtitle"},"🐛 Report a Bug"),
          el("button",{className:"cbtn",onClick:closeModal},"✕")
        ),
        !state.bugDone ? el("p",{style:{fontSize:"12px",color:"var(--t2)",marginBottom:"18px",lineHeight:"1.6"}},
          "Spotted something broken? Fill in what you can — the more detail, the faster it gets fixed."

        modalBody
      )
    );
  }

  if (resultsDiv) resultsDiv.id = "results-anchor";
  const main = el("div",{className:"wrap"},hero,modeToggle,searchCard,errDiv,loaderDiv,resultsDiv);
  app.appendChild(header);
  app.appendChild(main);
  app.appendChild(footer);
  if (profileDrawer) app.appendChild(profileDrawer);
  if (savedDrawer) app.appendChild(savedDrawer);
  if (tokenModal) app.appendChild(tokenModal);
  if (bugModal) app.appendChild(bugModal);

  // Restore scroll positions — runs after the new DOM is in place
  window.scrollTo(0, _scrollY);
  const _newRepoList = document.getElementById("company-repo-list");
  if (_newRepoList && _repoListScrollTop) _newRepoList.scrollTop = _repoListScrollTop;
}

render();
</script>
</body>
</html>
